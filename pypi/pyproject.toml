[build-system]
requires = ["setuptools>=81.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadquery-ocp"
version = "0.0.0.0"
description = "Python wrapper for Open CASCADE Technology 3D geometry library based on the official CadQuery/OCP sources"
authors = [{ name = "Bernhard Walter" }]
requires-python = ">=3.11,<3.15"
readme = "README.md"
# OCP's own binding code is Apache-2.0; the binary wheel also bundles the OCCT
# shared libraries (LGPL-2.1 WITH the Open CASCADE Exception) and other native
# libraries. The OCCT + third-party license texts and notices are added to the
# wheel at build time (see collect_licenses.py / THIRD-PARTY-NOTICES.txt).
license = "Apache-2.0 AND LGPL-2.1-only WITH OCCT-exception-1.0"
dependencies = ["cadquery-ocp-proxy==0.0.0.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["*", "cadquery_ocp*", "OCP"]

[tool.setuptools.package-data]
"cadquery_ocp" = ["../*.so", "../*.pyd", "*.txt", "LICENSE"]
"OCP" = ["*.so", "*.pyd", "*.dll", "*.dylib"]
