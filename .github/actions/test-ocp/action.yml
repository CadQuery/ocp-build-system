name: "Test OCP"
description: "Testing OCP wheels with build123d and CadQuery"
inputs:
  os:
    description: "Operating system to use for the build"
    required: true
  python-version:
    description: "Python version to use for the build"
    required: true
  use-vtk:
    description: "Whether to use VTK in the build"
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
    
    # - - -

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 #v9.0.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: false
        # Create & activate a venv for you
        activate-environment: true

    # - - -

    - name: Install tomli on Python 3.10
      shell: bash -l {0}
      if: ${{ matrix.python-version == '3.10' }}
      run: uv pip install "tomli>=1.1.0"

    # - - -
    
    - name: Download vtk cadquery_ocp wheel
      if: inputs.use-vtk == 'vtk'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
      with:
        name: cadquery-ocp-${{ env.WHEEL }}-${{ inputs.os }}-cp${{ inputs.python-version }}

    # - - -

    - name: Download novtk cadquery_ocp wheel
      if: inputs.use-vtk == 'novtk'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
      with:
        name: cadquery-ocp-novtk-${{ env.WHEEL }}-${{ inputs.os }}-cp${{ inputs.python-version }}

    # - - -

    - name: Download cadquery_ocp_proxy wheel
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
      with:
        name: cadquery-ocp-proxy-${{ env.WHEEL }}-cp-${{ matrix.python-version }}

    # - - -

    - name: Download cadquery_ocp_stubs wheel
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
      with:
        name: cadquery-ocp-${{ env.WHEEL }}-stubs-${{ inputs.os == 'macos-15-intel' && 'macos-15' || (inputs.os == 'ubuntu-22.04-arm' && 'ubuntu-22.04' || inputs.os) }}

    # - - -

    - name: Remove non-matching stubs wheel
      shell: bash -l {0}
      run: |
        # Remove the stubs wheel that doesn't match this platform
        # (artifact contains both arch variants for Linux and macOS)
        case "${{ inputs.os }}" in
          macos-15)         rm -f *macosx*x86_64*.whl ;;
          macos-15-intel)   rm -f *macosx*arm64*.whl ;;
          ubuntu-22.04)     rm -f *manylinux*aarch64*.whl ;;
          ubuntu-22.04-arm) rm -f *manylinux*x86_64*.whl ;;
        esac
        ls -l *.whl

    # - - -

    - name: Install VTK and OCP wheel (${{ inputs.use-vtk }})
      shell: bash -l {0}
      run: |
        # Install VTK and OCP wheel
        set -e
        set -o pipefail
        
        if [[ "${{ inputs.use-vtk }}" == "vtk" ]]; then
          uv pip install vtk==${{ env.VTK }}
        fi
        ls -l
        uv pip install *.whl

        uv pip list

        uv run python -c "import OCP; print('Success: OCP', OCP.__version__)"

    # - - -

    - name: Run build123d tests (${{ inputs.use-vtk }})
      shell: bash -l {0}
      run: |
        # Run build123d tests
        set -e
        set -o pipefail

        uv pip install packaging pytest

        # Install lib3mf wheel for Linux aarch64 (no PyPI wheel available)
        if [[ "$(uname -s)" == "Linux" && "$(uname -m)" == "aarch64" ]]; then
          echo "=> Installing lib3mf wheel for Linux aarch64"
          uv pip install pypi/lib3mf*.whl
        fi

        git clone https://github.com/gumyr/build123d.git
        cd build123d
        git checkout 2851b011901c5603eace947f411ebda9191b739c

        # build123d does not support OCP 8 yet: the NCollection typedefs moved into the
        # new OCP.collections module and Bnd_Box.Get() now returns an unbound Limits
        # struct. Pinned to the commit above so the patch applies deterministically.
        # Drop the checkout and this patch once the changes are upstream.
        git apply ../patches/build123d-ocp8.patch
        
        # The correct OCP variant is already installed from the wheels built above, so
        # drop the novtk dependency - it is the wrong package for the vtk job and carries
        # a "< 8.0" bound that excludes 8.x for the novtk one. Widen the stubs bound too.
        sed -i.bak '/"cadquery-ocp-novtk/d' pyproject.toml
        sed -i.bak 's/cadquery-ocp-stubs >= 7.9, < 8.0/cadquery-ocp-stubs >= 7.9, < 9.0/' pyproject.toml
        uv pip install .

        echo "=> Installed packages for test"
        uv pip list

        if [[ "${{ inputs.use-vtk }}" == "novtk" ]]; then
          echo "=> Running novtk tests"
          uv run --no-sync pytest tests -v -W ignore \
                 --deselect tests/test_materials.py::TestMaterialGltfExport::test_glb_pbr_values \
                 --ignore tests/test_direct_api/test_vtk_poly_data.py \
                 --ignore tests/test_direct_api/test_jupyter.py \
                 --ignore tests/test_examples.py  # 7.9. COMPATIBILITY ISSUE
        else
          echo "=> Running vtk tests"
          uv run --no-sync pytest tests -v -W ignore \
                 --deselect tests/test_materials.py::TestMaterialGltfExport::test_glb_pbr_values \
                 --ignore tests/test_examples.py  # 7.9. COMPATIBILITY ISSUE
        fi

    # - - -

    # cadquery 2.8 requires Python >= 3.11, and on macos-15-intel its
    # numba -> llvmlite dependency has no wheel and fails to build from source.
    - name: Run cadquery tests (${{ inputs.use-vtk }})
      if: inputs.use-vtk == 'vtk' && inputs.os != 'ubuntu-22.04-arm' && inputs.os != 'macos-15-intel' && inputs.python-version != '3.10'
      shell: bash -l {0}
      run: |
        # Run cadquery tests
        set -e
        set -o pipefail

        uv pip install "pytest<8.3.4" docutils ipython  # pin pytest to avoid atexit segfault on Windows

        git clone https://github.com/cadquery/cadquery.git
        cd cadquery

        # Patch to allow cadquery_ocp v7.9
        sed -i.bak 's/"cadquery-ocp>=7\.9\.3\.1,<8\.0",/"cadquery-ocp>=8.0,< 9.0",/' setup.py

        uv pip install .

        # 7.9. COMPATIBILITY ISSUE
        # 8.0 try without
        # sed -i.bak '/^from pytest import /s/$/, mark/' tests/test_free_functions.py
        # awk '/def test_cap/{print "@mark.skip()"} 1' tests/test_free_functions.py > tests/_tmp && mv tests/_tmp tests/test_free_functions.py
        
        # Workaround for casadi/nlopt atexit segfault on Windows
        # Use os._exit() to skip cleanup handlers entirely
        uv run python -c "import sys, os; import pytest; code = pytest.main(['tests', '-v', '-W', 'ignore']); os._exit(code)"
